<svg xmlns="http://www.w3.org/2000/svg" width="800" height="378" viewBox="0 0 800 378" role="img" aria-labelledby="t d">
<title id="t">草擬 5 步 → 保留 1 步、1 步視你的規則而定、移除 3 步</title>
<desc id="d">保留: 1. 在 argparse 加入 --version. 要求本身需要這一步; 移除: 2. 建立 VersionProvider 抽象類別與外掛機制. 只有一個版本來源，不需要抽象層; 移除: 3. 撰寫 docs/versioning-strategy.md. 要求的是一個參數，不是版本策略; 視規則而定: 4. 為 --version 的輸出加測試. 只有你的規則要求測試時才保留; 移除: 5. 為舊版 -V 別名加相容層. 沒有證據顯示 -V 曾經存在</desc>

<style>
  svg { --icon-on:#ffffff; }
  svg { --ink-1:#0b0b0b; --ink-2:#52514e; --muted:#898781; --track:#ef8f8e; --fill:#a51f23; --rule:#e1e0d9;
        --good:#0ca30c; --warn:#fab219; --bad:#d03b3b; }
  text { font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  .t1 { fill: var(--ink-1); }
  .t2 { fill: var(--ink-2); }
  .tm { fill: var(--muted); }
  .track { fill: var(--track); }
  .fill { fill: var(--fill); }
  .rule { stroke: var(--rule); stroke-width: 1; }
</style>
<rect width="800" height="378" rx="10" fill="#ffffff"/>
<g transform="translate(20,20)">

<text x="0" y="22" class="t1" font-size="16" font-weight="600" >草擬 5 步 → 保留 1 步、1 步視你的規則而定、移除 3 步</text>
<circle cx="8" cy="47" r="8" fill="var(--good)"/><path d="M4,47 l3,3 l5,-6" fill="none" stroke="var(--icon-on, #ffffff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="22" y="52" class="t2" font-size="13" font-weight="400" >保留</text>
<circle cx="84" cy="47" r="8" fill="var(--warn)"/><path d="M84,43 v4.5" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="84" cy="51" r="1.3" fill="#0b0b0b"/>
<text x="98" y="52" class="t2" font-size="13" font-weight="400" >視規則而定</text>
<path d="M194,42 l10,10 M204,42 l-10,10" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round"/>
<text x="213" y="52" class="t2" font-size="13" font-weight="400" >移除</text>
<circle cx="8" cy="85" r="8" fill="var(--good)"/><path d="M4,85 l3,3 l5,-6" fill="none" stroke="var(--icon-on, #ffffff)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="26" y="90" class="t1" font-size="14" font-weight="600" >1. 在 argparse 加入 --version</text>
<text x="26" y="109" class="t2" font-size="12" font-weight="400" >保留：要求本身需要這一步</text>
<line x1="0" y1="122" x2="760" y2="122" class="rule"/>
<path d="M3,132 l10,10 M13,132 l-10,10" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round"/>
<text x="26" y="142" class="tm" font-size="14" font-weight="400" text-decoration="line-through">2. 建立 VersionProvider 抽象類別與外掛機制</text>
<text x="26" y="161" class="t2" font-size="12" font-weight="400" >移除：只有一個版本來源，不需要抽象層</text>
<line x1="0" y1="174" x2="760" y2="174" class="rule"/>
<path d="M3,184 l10,10 M13,184 l-10,10" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round"/>
<text x="26" y="194" class="tm" font-size="14" font-weight="400" text-decoration="line-through">3. 撰寫 docs/versioning-strategy.md</text>
<text x="26" y="213" class="t2" font-size="12" font-weight="400" >移除：要求的是一個參數，不是版本策略</text>
<line x1="0" y1="226" x2="760" y2="226" class="rule"/>
<circle cx="8" cy="241" r="8" fill="var(--warn)"/><path d="M8,237 v4.5" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/><circle cx="8" cy="245" r="1.3" fill="#0b0b0b"/>
<text x="26" y="246" class="t1" font-size="14" font-weight="500" >4. 為 --version 的輸出加測試</text>
<text x="26" y="265" class="t2" font-size="12" font-weight="400" >視規則而定：只有你的規則要求測試時才保留</text>
<line x1="0" y1="278" x2="760" y2="278" class="rule"/>
<path d="M3,288 l10,10 M13,288 l-10,10" stroke="var(--bad)" stroke-width="2.4" stroke-linecap="round"/>
<text x="26" y="298" class="tm" font-size="14" font-weight="400" text-decoration="line-through">5. 為舊版 -V 別名加相容層</text>
<text x="26" y="317" class="t2" font-size="12" font-weight="400" >移除：沒有證據顯示 -V 曾經存在</text>
</g>
</svg>
