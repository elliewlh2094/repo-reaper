<desc id="d">Kept: 1. Add --version to argparse. The request needs it; Removed: 2. Create a VersionProvider abstract class and a plugin system. One version source needs no abstraction; Removed: 3. Write docs/versioning-strategy.md. The request is a flag, not a policy; Depends: 4. Add a test for the --version output. Kept only if your rules require a test; Removed: 5. Add a compatibility layer for a legacy -V alias. Nothing shows that -V ever existed</desc>

